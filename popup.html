<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Stretchtext</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <header>
            <img src="icons/icon48.png" alt="" width="24" height="24" />
            <h1>Stretchtext</h1>
        </header>

        <section class="row">
            <label for="enabled">Enabled</label>
            <input type="checkbox" id="enabled" />
        </section>

        <section class="row">
            <label for="model">Model</label>
            <select id="model">
                <option value="openai/gpt-5.4-nano">openai/gpt-5.4-nano — cheapest</option>
                <option value="openai/gpt-5-nano">openai/gpt-5-nano</option>
                <option value="google/gemini-2.5-flash-lite">
                    google/gemini-2.5-flash-lite
                </option>
                <option value="meituan/longcat-2.0">meituan/longcat-2.0</option>
            </select>
        </section>

        <section class="row status">
            <span id="status" role="status">Checking your Pollen…</span>
            <span id="balance" class="balance"></span>
        </section>

        <section class="row">
            <button id="connect" type="button">Connect with Pollen</button>
        </section>

        <p class="hint">
            Click any dotted-underlined phrase on a page to grow it where it
            stands. Click again to shrink it back. Expansions are billed to your
            own Pollen balance, and the key lives in memory for this browser
            session only.
        </p>

        <script src="lib/storage.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
